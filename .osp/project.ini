[travel.loc]

backend           = off
backend_ip        = 
backend_port      = 
aliases           = www.{host}
enabled           = on
environment       = System
http2             = off
http_engine       = Apache
http_port         = 80
https_port        = 443
ip                = auto
node_engine       = 
php_engine        = PHP-8.3
web_engine        = Apache
project_dir       = {base_dir}
project_url       = {host_scheme}://{host_decoded}{scheme_port}
public_dir        = {base_dir}\public
ssl               = on
ssl_cert_file     = auto
ssl_key_file      = auto
start_command     = 
terminal_codepage = 65001
